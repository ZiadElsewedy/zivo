*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#F6F4EF; --card:#FFFFFF; --ink:#1D1A16; --ink-2:#6B655C; --ink-3:#A49E93;
  --hair:rgba(29,26,22,0.09); --hair-2:rgba(29,26,22,0.14);
  --ember:#FF5A1F; --ember-t:#DC490E; --pulse:#12C48A; --pulse-t:#0A8F63;
  --solar:#F6B300; --solar-t:#A9760A; --iris:#6E5BFF; --iris-t:#5B49E6; --flare:#FF3D6E; --flare-t:#DE2C56;
  --ember-wash:#FFF3EB; --solar-wash:#FFF7E4;
  --shadow-m:0 2px 4px rgba(60,45,30,0.04),0 14px 30px -16px rgba(60,45,30,0.22);
  --sheet-shadow:0 -2px 8px rgba(60,45,30,0.05),0 -24px 60px -20px rgba(60,45,30,0.30);
  --display:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'Hanken Grotesk',system-ui,sans-serif;
  --serif:'Fraunces',Georgia,serif;
  --ease:cubic-bezier(0.2,0.8,0.2,1);
}
body{background:radial-gradient(130% 70% at 50% -5%,#FFFDF8 0%,#F3F0E9 60%,#ECE8E0 100%);
  min-height:100vh;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;
  padding:40px 24px 64px;font-variant-numeric:tabular-nums}
.page-head{max-width:1240px;margin:0 auto 30px;display:flex;align-items:center;gap:11px;color:var(--ink-3);
  font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:0.14em;text-transform:uppercase}
.page-head .zmark{width:18px;height:18px;color:var(--ink);opacity:.85}
.page-head b{color:var(--ink-2);font-weight:600}
.grid{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;gap:40px 34px;justify-content:center}
.cell{display:flex;flex-direction:column;gap:16px;align-items:center}
.cap{display:flex;flex-direction:column;gap:5px;align-items:center;text-align:center}
.cap .t{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-0.01em;color:var(--ink)}
.cap .d{font-family:var(--body);font-size:12.5px;color:var(--ink-3);max-width:340px;line-height:1.5}

.device{width:376px;border-radius:44px;background:#EDE9E1;padding:10px;border:1px solid rgba(60,45,30,0.10);
  box-shadow:0 2px 4px rgba(60,45,30,0.06),0 44px 90px -34px rgba(60,45,30,0.42)}
.screen{position:relative;width:100%;height:780px;background:var(--bg);border-radius:35px;overflow:hidden;display:flex;flex-direction:column}
.status{height:42px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 24px;
  font-family:var(--body);font-weight:600;font-size:13.5px;color:var(--ink)}
.status .r{display:flex;align-items:center;gap:5px}
.status .r i{display:block;width:3px;background:var(--ink);border-radius:1px}
.status .r i:nth-child(1){height:5px;opacity:.4}.status .r i:nth-child(2){height:7px;opacity:.6}
.status .r i:nth-child(3){height:9px;opacity:.8}.status .r i:nth-child(4){height:11px}
.status .bat{width:21px;height:11px;border:1.5px solid var(--ink);border-radius:3px;position:relative;opacity:.85;margin-left:5px}
.status .bat::after{content:"";position:absolute;inset:2px;right:8px;background:var(--ink);border-radius:1px}

/* scrim + sheet */
.scrim{position:absolute;inset:0;background:rgba(29,22,14,0.34);backdrop-filter:blur(2px)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:26px 26px 0 0;
  box-shadow:var(--sheet-shadow);padding:12px 22px 26px}
.grab{width:38px;height:4px;border-radius:999px;background:var(--hair-2);margin:2px auto 16px}
.sheet-title{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:-0.01em;color:var(--ink);margin:0 2px 6px}

/* capture options */
.opt{display:flex;align-items:center;gap:15px;padding:15px 6px;border-bottom:1px solid var(--hair)}
.opt:last-child{border-bottom:none}
.opt .ic{width:44px;height:44px;border-radius:13px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  background:#F4F1EA;color:var(--ink)}
.opt .ic svg{width:21px;height:21px}
.opt .ic.solar{background:var(--solar-wash);color:var(--solar-t)}
.opt .ic.ember{background:var(--ember-wash);color:var(--ember-t)}
.opt .txt{display:flex;flex-direction:column;gap:2px}
.opt .l{font-family:var(--body);font-weight:600;font-size:16.5px;color:var(--ink)}
.opt .h{font-family:var(--body);font-weight:400;font-size:13px;color:var(--ink-3)}
.opt .go{margin-left:auto;color:var(--ink-3)}

/* header bar for capture screens */
.capbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:6px 22px 2px}
.capbar .x{width:34px;height:34px;border-radius:999px;background:#EFEBE3;display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.capbar .x svg{width:16px;height:16px}
.capbar .ttl{font-family:var(--body);font-weight:600;font-size:14px;color:var(--ink-2)}
.capbar .sp{width:34px}

/* amount */
.amount{flex:0 0 auto;text-align:center;padding:26px 0 14px}
.amount .cur{font-family:var(--body);font-weight:600;font-size:15px;color:var(--ink-3);letter-spacing:0.08em;text-transform:uppercase}
.amount .val{font-family:var(--display);font-weight:700;font-size:66px;letter-spacing:-0.03em;color:var(--ink);line-height:1;margin-top:8px;display:inline-flex;align-items:center}
.amount .car{display:inline-block;width:3px;height:52px;background:var(--solar);margin-left:5px;border-radius:2px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.car{animation:none}}

/* chips */
.chiprow{display:flex;flex-wrap:wrap;gap:9px;padding:6px 20px 4px;justify-content:center}
.chip{font-family:var(--body);font-weight:600;font-size:13.5px;padding:9px 15px;border-radius:999px;
  border:1.4px solid var(--hair-2);color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip.sel{background:var(--solar);border-color:var(--solar);color:#2A2205}
.chip .e{font-size:14px}

/* meta row */
.metarow{display:flex;align-items:center;gap:10px;padding:14px 22px 10px;justify-content:center}
.metabtn{font-family:var(--body);font-weight:500;font-size:13.5px;color:var(--ink-3);border:1.4px solid var(--hair);
  border-radius:999px;padding:8px 14px;display:inline-flex;align-items:center;gap:7px}
.metabtn.on{color:var(--ink);border-color:var(--hair-2)}
.metabtn svg{width:14px;height:14px}

/* keypad */
.keypad{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 18px 4px;margin-top:auto}
.key{font-family:var(--display);font-weight:500;font-size:26px;color:var(--ink);background:var(--card);
  border:1px solid var(--hair);border-radius:16px;height:56px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-m)}
.key.fn{background:transparent;box-shadow:none;border-color:transparent;color:var(--ink-2)}
.key.fn svg{width:24px;height:24px}
.savebar{padding:14px 18px 6px}
.save{width:100%;font-family:var(--body);font-weight:700;font-size:16px;color:#2A2205;background:var(--solar);
  border:none;border-radius:999px;padding:16px;box-shadow:0 12px 26px -10px rgba(246,179,0,0.6);
  display:flex;align-items:center;justify-content:center;gap:8px}
.save.ember{color:#fff;background:var(--ember);box-shadow:0 12px 26px -10px rgba(255,90,31,0.55)}

/* task */
.titlefield{flex:0 0 auto;padding:30px 24px 6px}
.titlefield .inp{font-family:var(--display);font-weight:600;font-size:27px;letter-spacing:-0.015em;color:var(--ink);display:inline-flex;align-items:center}
.titlefield .car2{display:inline-block;width:2.5px;height:28px;background:var(--ember);margin-left:3px;border-radius:2px;animation:blink 1.1s steps(1) infinite}
.taskchips{display:flex;flex-wrap:wrap;gap:9px;padding:18px 24px 6px}
.tchip{font-family:var(--body);font-weight:600;font-size:13.5px;padding:9px 15px;border-radius:999px;border:1.4px solid var(--hair-2);color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.tchip.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.tchip.pri{color:var(--flare-t);border-color:rgba(222,44,86,0.35)}
.tchip svg{width:13px;height:13px}
.kbhint{margin-top:auto;height:250px;background:linear-gradient(to bottom,#E7E3DA,#DED9CF);border-top:1px solid var(--hair);
  display:flex;align-items:flex-start;justify-content:center;padding-top:12px}
.kbrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:330px}
